<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Forge AI — Forge Workspace</title>
<style>
:root{--bg:#07101d;--panel:#0d1726;--panel2:#111e30;--line:#203149;--text:#eef4ff;--muted:#91a1b8;--blue:#5b7cff;--green:#24d08b;--red:#ff647c;--yellow:#f7c95c}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px Inter,Segoe UI,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:flex}.side{width:245px;background:#091321;border-right:1px solid var(--line);padding:15px;display:flex;flex-direction:column;gap:12px}.brand{font-weight:950;font-size:17px;padding:5px}.brand span{display:block;color:#70829d;font-size:9px;margin-top:4px}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:#9aabc1;text-align:left;border-radius:10px;padding:10px;font-weight:800}.nav button:hover,.nav button.active{background:#14233a;border-color:#263b5c;color:#fff}.sideState{margin-top:auto;border:1px solid var(--line);background:#0d1828;border-radius:12px;padding:10px;color:#91a1b8;font-size:10px;line-height:1.5}.main{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:64px;flex:none;border-bottom:1px solid var(--line);background:#0a1422;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.head b{font-size:14px}.head small{display:block;color:#71839b;font-size:9px;margin-top:3px}.headRight{display:flex;gap:8px;align-items:center}.status{font-size:9px;font-weight:950;padding:7px 10px;border-radius:999px;background:#25141a;color:var(--red)}.content{overflow:auto;flex:1;padding:22px}.page{max-width:1250px;margin:auto}.hero{margin-bottom:16px}.eyebrow{color:#6f89ff;font-weight:950;font-size:9px;letter-spacing:.14em}.hero h1{font-size:31px;letter-spacing:-.04em;margin:5px 0}.hero p{color:var(--muted);line-height:1.6;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.card{cursor:pointer}.card:hover{border-color:#38578a}.metric{background:#0c1828;border:1px solid var(--line);border-radius:12px;padding:12px}.metric b{display:block;font-size:20px}.metric span{color:#788aa3;font-size:8px}.btn{border:1px solid #2b405f;background:#101d30;color:#dce7f7;border-radius:9px;padding:9px 12px;font-weight:850}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.good{background:#123c31;border-color:#1e7657;color:#8ff2c7}.btn.danger{background:#3a1820;border-color:#713141;color:#ff9bad}.btn.big{padding:12px 16px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.field{margin-bottom:11px}.field label{display:block;color:#8193ad;font-size:8px;font-weight:950;margin-bottom:5px}.field input,.field textarea{width:100%;background:#091421;border:1px solid #263b56;color:#eef4ff;border-radius:9px;padding:10px;outline:none}.field textarea{resize:vertical}.console{height:calc(100vh - 145px);display:flex;flex-direction:column}.messages{flex:1;overflow:auto;min-height:0}.msg{border:1px solid #203149;background:#0b1726;border-radius:10px;padding:10px;margin:7px 0;white-space:pre-wrap;line-height:1.55}.msg.user{background:#111f36;margin-left:8%}.who{color:#7690ff;font-size:8px;font-weight:950;margin-bottom:3px}.compose{display:flex;gap:8px;margin-top:9px}.compose input{flex:1}.log{background:#08121e;border:1px solid #1d3048;border-radius:9px;padding:10px;font:10px ui-monospace,monospace;color:#9eb0c8;white-space:pre-wrap;max-height:330px;overflow:auto}.phase{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.phase div{border:1px solid #243852;border-radius:8px;padding:9px;font-size:8px;font-weight:900;color:#7488a5}.phase .on{background:#17264b;border-color:#5b7cff;color:#b9c6ff}.drop{border:1px dashed #38547a;padding:18px;border-radius:11px;text-align:center;color:#8da0bb;background:#0a1625}.file{display:flex;justify-content:space-between;gap:8px;padding:8px;border:1px solid #22364f;border-radius:8px;margin-top:6px;font-size:9px}.pill{padding:5px 8px;border-radius:999px;background:#13213a;color:#91a6c7;font-size:8px;font-weight:900}.stop{display:none}.stop.show{display:inline-flex}@media(max-width:900px){.side{width:190px}.grid,.grid4{grid-template-columns:1fr 1fr}.phase{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.side{width:150px}.grid,.grid4{grid-template-columns:1fr}.headRight .btn{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">Roblox Forge AI<span>AAA STUDIO BUILDER · LOCAL-FIRST</span></div>
<div class="nav">
<button class="active" data-page="forge">⚡ Forge AI</button>
<button data-page="studio">🎮 Studio</button>
<button data-page="planner">🧠 AAA Planner</button>
<button data-page="chat">💬 AI Chat</button>
<button data-page="files">📎 Files</button>
<button data-page="logs">📋 Activity / Logs</button>
<button data-page="settings">⚙ Settings</button>
</div>
<div class="sideState" id="sideState">Bridge offline<br>Forge AI hazır</div>
</aside>
<main class="main">
<header class="head"><div><b>Forge Workspace</b><small id="subtitle">Plan → Approval → GUI → Code → QA → Re-test</small></div><div class="headRight"><div id="status" class="status">OFFLINE</div><button id="stopTop" class="btn danger stop">■ STOP / DURDUR</button><button id="forgeTop" class="btn primary big">⚡ FORGE AI</button></div></header>
<section id="content" class="content"></section>
</main></div>
<script>
'use strict';
const D=window.robloxForgeDesktop,content=document.getElementById('content'),msgs=[],files=[];
let page='forge',phase=0,planning=false;
const phases=['DISCOVER','PLAN','APPROVAL','GUI','CODE','QA','DONE'];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function toast(s){const x=document.getElementById('subtitle');x.textContent=s;setTimeout(()=>x.textContent='Plan → Approval → GUI → Code → QA → Re-test',3500)}
function actionEventText(t){const s=String(t||'');let m=s.match(/\[PLAN (\d+)\/(\d+)\]/);const counter=document.getElementById('actionCounter');if(m&&counter){counter.textContent=m[1]+'/'+m[2];document.getElementById('pipelineText').textContent='PLAN'}m=s.match(/\[ACTION (\d+)\/(\d+) (START|TOOL|SUCCESS|FAILED)\]/);if(m&&counter){counter.textContent=m[1]+'/'+m[2];document.getElementById('pipelineText').textContent=m[3]==='SUCCESS'?'ACTION TAMAMLANDI':m[3]==='FAILED'?'ACTION HATA':'ACTION '+m[3]}}
function add(role,t){msgs.push({role,t:String(t)});if(msgs.length>150)msgs.shift();renderMsgs();D?.log('chat.message',{role,text:String(t).slice(0,500)})}
function renderMsgs(){const m=document.getElementById('messages');if(!m)return;m.innerHTML=msgs.map(x=>'<div class="msg '+x.role+'"><div class="who">'+(x.role==='user'?'YOU':x.role==='tool'?'FORGE':'ASTRA')+'</div>'+esc(x.t)+'</div>').join('');m.scrollTop=m.scrollHeight}
function phaseSet(n){phase=Math.max(0,Math.min(6,n));const p=document.getElementById('phase');if(p)p.innerHTML=phases.map((x,i)=>'<div class="'+(i===phase?'on':'')+'">'+String(i+1).padStart(2,'0')+' · '+x+'</div>').join('')}
function setBridgeState(s){const st=document.getElementById('status'),ss=document.getElementById('sideState');if(!st)return;st.textContent=s.toUpperCase();st.style.background=(s==='online'||s==='ready')?'#12372d':'#29151c';st.style.color=(s==='online'||s==='ready')?'#62e5ad':'#ff7d91';if(ss)ss.innerHTML='Bridge '+s+'<br>Forge AI '+(s==='online'?'aktif':'hazır')}
function forge(){show('forge')}
function forgePage(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">⚡ FORGE AI · ONE BUTTON WORKFLOW</div><h1>Roblox Studio için uçtan uca AI Builder.</h1><p>Tek komutla Studioyu keşfet, AAA plan üret, onay al, GUI/sistem/kod üret, test et ve sorunları tekrar düzelt. İstediğin anda STOP ile işlemi kes.</p></div><div class="grid4"><div class="metric"><b>01</b><span>DISCOVER</span></div><div class="metric"><b>02</b><span>AAA PLAN</span></div><div class="metric"><b>03</b><span>GUI + CODE</span></div><div class="metric"><b>04</b><span>QA + RETEST</span></div></div><div class="panel" style="margin-top:12px"><div class="field"><label>PROJE HEDEFİ</label><textarea id="goal" rows="7" placeholder="Örn: Anime battleground. Mobil uyumlu, güçlü lobby, matchmaking, combat GUI, inventory, quests, DataStore, VFX/SFX, anti-exploit, economy ve retention sistemi. Önce mevcut Studioyu analiz et."></textarea></div><div class="actions"><button class="btn primary big" data-action="runForge">⚡ FORGE AI — HEPSİNİ BAŞLAT</button><button class="btn danger big" data-action="stop">■ STOP / DURDUR</button><button class="btn" data-action="attach">📎 100K KARAKTERE KADAR DOSYA EKLE</button></div><input id="fileInput" type="file" multiple hidden><div id="fileList"></div></div><div class="panel" style="margin-top:12px"><div class="sectionTitle"><b>Pipeline</b><span class="pill" id="actionCounter">0/0</span><span class="pill" id="pipelineText">Bekliyor</span></div><div class="phase" id="phase"></div></div><div class="panel" style="margin-top:12px"><div class="sectionTitle"><b>Forge AI Console</b><button class="btn" data-action="chat">Chat&#39;e Git</button></div><div id="messages" class="messages" style="max-height:330px"></div></div></div>';phaseSet(phase);renderMsgs();bindFiles()}
function studioPage(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">🎮 ROBLOX STUDIO INTELLIGENCE</div><h1>Gerçek Studio kontrol döngüsü.</h1><p>Bridge bağlantısını yönet, Studioyu tara, Output/QA döngüsünü Forge AI pipelineına bağla.</p></div><div class="grid"><div class="card"><h3>Bridge</h3><p>Yerel MCP bridge ile Roblox Studio bağlantısı.</p><div class="actions"><button class="btn primary" data-action="connect">Bağlan</button><button class="btn danger" data-action="stop">Durdur</button></div></div><div class="card"><h3>Deep Scan</h3><p>DataModel, scripts, GUI, map, assets, remotes, performance ve mevcut sistemleri analiz et.</p><button class="btn" data-action="scan">Full Studio Scan</button></div><div class="card"><h3>QA Loop</h3><p>Build → Playtest → Output → Fix → Re-test. Yıkıcı değişikliklerden önce onay iste.</p></div></div><div class="panel" style="margin-top:12px"><div class="log" id="studioLog"></div></div></div>'}
function plannerPage(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">🧠 AAA PLANNER</div><h1>Önce plan. Sonra üretim.</h1><p>Forge AI rastgele kod dökmez; mevcut Studio durumuna göre bağımlılık sıralı üretim planı çıkarır.</p></div><div class="panel"><div class="field"><label>GAME BRIEF</label><textarea id="planBrief" rows="10" placeholder="Tür, hedef platform, oyuncu sayısı, core loop, monetization, retention, görsel stil, performans hedefleri..."></textarea></div><button class="btn primary big" data-action="makePlan">AAA PLAN OLUŞTUR</button></div><div class="panel" style="margin-top:12px"><div class="phase" id="phase2"></div></div></div>';document.getElementById('phase2').innerHTML=phases.map((x,i)=>'<div class="'+(i===phase?'on':'')+'">'+String(i+1).padStart(2,'0')+' · '+x+'</div>').join('')}
function chatPage(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">💬 ASTRA COMMAND CENTER</div><h1>Doğal dille komut ver.</h1><p>Planla, analiz et, GUI tasarla, kodla, test et veya durdur.</p></div><div class="panel console"><div id="messages" class="messages"></div><div class="compose"><input id="prompt" placeholder="Örn: mevcut combat sistemini analiz et ve eksik GUI&#39;yi planla..."><button class="btn primary" data-action="send">Gönder</button></div></div></div>';renderMsgs()}
function filesPage(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">📎 PROJECT CONTEXT</div><h1>Dosya bağlamı</h1><p>Her dosya için maksimum 100.000 karakter. Lua, Luau, JSON, TXT, MD, CSV ve benzeri metin dosyalarını ekleyebilirsin.</p></div><div class="panel"><div class="drop">Dosyaları Forge AI&#39;a eklemek için aşağıdaki butonu kullan.<div class="actions" style="justify-content:center"><button class="btn primary" data-action="attach">Dosya Seç</button></div></div><div id="fileList"></div></div></div>';bindFiles()}
function logsPage(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">📋 ACTIVITY</div><h1>Forge geçmişi</h1></div><div class="panel"><div class="log" id="logs"></div></div></div>';D?.snapshot().then(s=>{const x=document.getElementById('logs');if(x)x.textContent=(s.actions||[]).map(a=>new Date(a.createdAt).toLocaleString()+' · '+a.action+' '+JSON.stringify(a.detail||{})).join('\n\n')||'Henüz aktivite yok'})}
function settingsPage(){content.innerHTML=`<div class="page"><div class="hero"><div class="eyebrow">⚙ SETTINGS</div><h1>Forge yapılandırması</h1></div><div class="panel"><div class="field"><label>AI PROVIDER</label><select id="provider"><option value="noxery">Noxery Cloud · GPT-6 Astra</option><option value="lemonade">Lemonade Local · OpenAI Compatible</option></select></div><div class="field"><label>MODEL</label><input id="model"></div><div class="field"><label>FORGE API KEY</label><input id="forgeKey"></div><div class="field"><label>NOXERY API KEY</label><input id="noxeryKey" type="password"></div><div class="actions"><button class="btn primary" data-action="connect">Bridge&#39;i Başlat</button><button class="btn" data-action="key">Yeni Forge Key</button></div><p style="color:#7f91aa;font-size:9px">Anahtarları EXE içine sabitleme. Kullanıcı bazlı veya server-side yönetilen provider kullan.</p></div></div>`;document.getElementById("provider").value=localStorage.getItem("provider")||"noxery";document.getElementById("model").value=localStorage.getItem("model")||(localStorage.getItem("provider")==="lemonade"?"auto":"gpt-6-astra");document.getElementById("forgeKey").value=localStorage.getItem("forgeKey")||"";document.getElementById("noxeryKey").value=localStorage.getItem("noxeryKey")||""}
function show(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({forge:forgePage,studio:studioPage,planner:plannerPage,chat:chatPage,files:filesPage,logs:logsPage,settings:settingsPage}[p]||forgePage)()}
function bindFiles(){const i=document.getElementById('fileInput');if(i)i.onchange=async e=>{for(const f of [...e.target.files]){const text=await f.text();if(text.length>100000){add('tool','[FILE] '+f.name+' reddedildi: 100.000 karakter sınırı.');continue}files.push({name:f.name,text});add('tool','[FILE] '+f.name+' eklendi ('+text.length+' karakter).')}renderFileList()}}
function renderFileList(){document.querySelectorAll('#fileList').forEach(box=>box.innerHTML=files.map((f,i)=>'<div class="file"><span>'+esc(f.name)+' · '+f.text.length.toLocaleString()+' karakter</span><button class="btn danger" data-remove="'+i+'">Sil</button></div>').join(''))}
async function connect(){let f=document.getElementById('forgeKey')?.value.trim()||localStorage.getItem('forgeKey')||'',n=document.getElementById('noxeryKey')?.value.trim()||localStorage.getItem('noxeryKey')||'',provider=document.getElementById('provider')?.value||localStorage.getItem('provider')||'noxery',model=document.getElementById('model')?.value.trim()||localStorage.getItem('model')||(provider==='lemonade'?'auto':'gpt-6-astra');if(!f){try{const k=await D.createKey();f=k.key;localStorage.setItem('forgeKey',f)}catch(e){toast(e.message)}}if(!n){show('settings');toast('Noxery API Key gerekli.');return}localStorage.setItem('forgeKey',f);localStorage.setItem('noxeryKey',n);localStorage.setItem('provider',provider);localStorage.setItem('model',model);try{await D.start(f,n,true,provider,model);setBridgeState('starting')}catch(e){toast(e.message)}}
function stop(){planning=false;document.querySelectorAll('.stop').forEach(x=>x.classList.remove('show'));D?.stop();add('tool','[STOP] Forge AI işlemi durduruldu.');setBridgeState('offline')}
function makeContext(){return files.length?'\n\nATTACHED FILES:\n'+files.map(f=>'--- '+f.name+' ---\n'+f.text).join('\n'):'')}
async function runForge(goal){const g=(goal||document.getElementById('goal')?.value||'').trim();if(!g){toast('Önce proje hedefini yaz.');return}if(!D){toast('Desktop bridge bulunamadı.');return}planning=true;document.querySelectorAll('.stop').forEach(x=>x.classList.add('show'));phaseSet(0);document.getElementById('pipelineText').textContent='Forge AI başlıyor';const prompt=`FORGE AI FULL AUTONOMOUS DEVELOPMENT WORKFLOW. Kullanıcı hedefi: ${g}
ÖNCE hiçbir dosyayı değiştirmeden Roblox Studioyu derinlemesine analiz et: DataModel, mevcut scripts/modules, GUI, remotes, assets, map, systems, performance, mobile, anti-exploit, DataStore ve Output.
SONRA AAA seviyesinde bağımlılık sıralı plan çıkar: architecture, core loop, progression, UI/UX, GUI hierarchy, map, assets, VFX/SFX, economy, networking, security, retention, mobile/performance, QA.
PLAN aşamasında değişiklik yapma; kullanıcı onayı gerektiren adımları açıkça işaretle.
Onay varsa küçük ve doğrulanabilir adımlarla GUI + sistem + Luau kodu üret; her adımdan sonra compile/playtest/output kontrolü yap; hataları düzelt ve tekrar test et.
Mevcut kodu gereksiz yere bozma. Var olan sistemi önce anla, sonra genişlet.
Her aşamada ne yaptığını kısa raporla. STOP komutu gelirse anında dur.
${makeContext()}`;add('user',g);try{await D.start(localStorage.getItem('forgeKey')||'',localStorage.getItem('noxeryKey')||'',true);D.send(prompt);for(let i=1;i<=6&&planning;i++){phaseSet(i);document.getElementById('pipelineText').textContent=phases[i]+' aşaması';await new Promise(r=>setTimeout(r,300))}}catch(e){add('tool','[ERROR] '+e.message)}finally{planning=false;document.querySelectorAll('.stop').forEach(x=>x.classList.remove('show'))}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
document.getElementById('forgeTop').onclick=forge;document.getElementById('stopTop').onclick=stop;
content.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(e.target.closest('[data-remove]')){files.splice(Number(e.target.closest('[data-remove]').dataset.remove),1);renderFileList();return}if(a==='attach'){let i=document.getElementById('fileInput');if(!i){i=document.createElement('input');i.type='file';i.multiple=true;i.id='fileInput';i.style.display='none';document.body.appendChild(i);bindFiles()}i.click();return}if(a==='runForge')runForge();if(a==='stop')stop();if(a==='connect')connect();if(a==='scan')D?.send('DEEP STUDIO SCAN: mevcut projeyi sadece analiz et, değişiklik yapma.');if(a==='chat')show('chat');if(a==='makePlan'){const b=document.getElementById('planBrief')?.value.trim();if(b)runForge(b)}if(a==='send'){const p=document.getElementById('prompt')?.value.trim();if(p){add('user',p);document.getElementById('prompt').value='';D?.send(p)}}if(a==='key')D?.createKey().then(x=>{localStorage.setItem('forgeKey',x.key);toast('Forge API Key oluşturuldu.')})});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='prompt'){e.preventDefault();document.querySelector('[data-action="send"]')?.click()}});
if(D)D.onEvent(e=>{if(e.type==='state'){setBridgeState(e.state);if(e.state==='online')toast('Roblox Studio bağlı.')}if(e.type==='log'){const t=String(e.text||'');actionEventText(t);if(t.trim())add('tool',t);const sl=document.getElementById('studioLog');if(sl)sl.textContent+=t}});
show('forge');
</script>
</body></html>
