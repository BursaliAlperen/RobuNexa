<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox Forge AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,Segoe UI,system-ui,sans-serif}.app{height:100vh;display:flex}.side{width:245px;background:#fff;border-right:1px solid #dce3ee;padding:16px;display:flex;flex-direction:column}.brand{font-weight:950;font-size:16px;padding:8px 5px 22px}.brand small{display:block;color:#8994a6;font-size:9px;margin-top:3px}.nav{display:grid;gap:5px}.nav button,.btn{border:1px solid #d7deea;background:#fff;border-radius:10px;padding:11px 12px;text-align:left;font-weight:800;color:#647187;cursor:pointer}.nav button.active,.nav button:hover{background:#eef2ff;border-color:#dbe2ff;color:#4563e6}.sidebottom{margin-top:auto;border:1px solid #e1e6ee;background:#f8fafc;border-radius:12px;padding:11px;font-size:10px;color:#758196}.main{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:65px;background:#fff;border-bottom:1px solid #dce3ee;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.head small{display:block;color:#8a95a6;font-size:9px;margin-top:3px}.head b{font-size:14px}.status{padding:7px 10px;border-radius:999px;background:#fff1f3;color:#d14e63;font-size:9px;font-weight:950;margin-right:8px}.content{padding:24px;overflow:auto}.page{max-width:1100px;margin:auto}.hero h1{font-size:38px;letter-spacing:-.05em;margin:6px 0}.hero p{color:#718096;font-size:13px;line-height:1.6}.eyebrow{font-size:9px;letter-spacing:.14em;font-weight:950;color:#5670db}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.card{background:#fff;border:1px solid #dce3ee;border-radius:16px;padding:18px;box-shadow:0 12px 35px #26324d0b}.card h3{font-size:14px;margin:8px 0}.card p{font-size:11px;color:#778296;line-height:1.55}.icon{font-size:9px;font-weight:950;color:#4b67df;background:#eef2ff;border-radius:9px;padding:9px;display:inline-block}.panel{margin-top:12px;background:#fff;border:1px solid #dce3ee;border-radius:16px;padding:17px}.console{height:calc(100vh - 185px);display:flex;flex-direction:column}.messages{flex:1;overflow:auto}.msg{padding:10px 12px;margin:8px 0;border:1px solid #e1e6ef;border-radius:11px;background:#f8fafc;font-size:12px;line-height:1.55;white-space:pre-wrap}.user{background:#eef2ff;margin-left:12%}.who{font-size:8px;font-weight:950;color:#5870d9;margin-bottom:3px}.compose{display:flex;gap:8px;margin-top:10px}.compose input,.field input,.field textarea{width:100%;border:1px solid #d5dce7;border-radius:10px;padding:11px;outline:none}.compose input{flex:1}.primary{background:#4f6fff;color:#fff;border-color:#4f6fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.field{margin-bottom:12px}.field label{display:block;font-size:9px;font-weight:900;color:#758196;margin-bottom:6px}.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px}.phase{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.phase div{padding:9px;border:1px solid #e1e6ef;border-radius:9px;background:#fafbfd;font-size:8px;font-weight:850}.phase .on{background:#eef2ff;border-color:#9fb0ef;color:#4563e6}.log{margin-top:10px;max-height:240px;overflow:auto;background:#f8fafc;border:1px solid #e1e6ef;border-radius:10px;padding:10px;font:11px monospace;white-space:pre-wrap;color:#647187}@media(max-width:800px){.side{width:190px}.grid{grid-template-columns:1fr}.keys{grid-template-columns:1fr}.phase{grid-template-columns:1fr 1fr}.content{padding:14px}.hero h1{font-size:30px}}</style></head><body><div class="app"><aside class="side"><div class="brand">Roblox Forge AI<small>LOCAL DESKTOP WORKSPACE · GPT-6 ASTRA</small></div><div class="nav"><button class="active" data-p="dashboard">Dashboard</button><button data-p="chat">AI Chatbot</button><button data-p="studio">Studio Intelligence</button><button data-p="plan">AAA Planner</button><button data-p="logs">Activity / Logs</button><button data-p="keys">API Keys</button></div><div class="sidebottom" id="sideState">Bridge offline<br>Local EXE mode</div></aside><main class="main"><header class="head"><div><b>Forge Workspace</b><small>Website'ten bağımsız yerel EXE arayüzü</small></div><div><span class="status" id="status">OFFLINE</span><button class="btn primary" id="connect">Bağlan</button></div></header><section class="content" id="content"></section></main></div><script>
const D=window.robloxForgeDesktop;const content=document.getElementById('content');const msgs=[];let phase=0,planPending=false;const phases=['KEŞFEDİLİYOR','PLANLANIYOR','PLAN ONAYI','GUI TASARIMI','KODLAMA & SİSTEMLER','TEST & DOĞRULAMA','TAMAMLANDI'];
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function add(role,t){msgs.push({role,t});if(msgs.length>100)msgs.shift();renderMsgs()}
function renderMsgs(){let m=document.getElementById('messages');if(!m)return;m.innerHTML=msgs.map(x=>'<div class="msg '+x.role+'"><div class="who">'+(x.role==='user'?'YOU':x.role==='tool'?'TOOL':'ASTRA')+'</div>'+esc(x.t)+'</div>').join('');m.scrollTop=m.scrollHeight}
function pipeline(){return '<div class="panel"><div class="eyebrow">PRODUCTION PIPELINE</div><b>Plan → Onay → Etap Etap Uygula</b><div class="phase">'+phases.slice(0,6).map((x,i)=>'<div class="'+(i===phase?'on':'')+'">'+String(i+1).padStart(2,'0')+' · '+x+'<br><span style="font-weight:600;color:#8994a6">+'+(i<=phase?1:0)+' +-</span></div>').join('')+'</div>'+(planPending?'<div class="actions"><button class="btn primary" id="approve">PLAN KABUL ET</button><button class="btn" id="revise">REVİZE ET</button></div>':'')+'</div>'}
function dashboard(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">ROBLOX FORGE AI · LOCAL</div><h1>Studio için gerçek AI çalışma alanı.</h1><p>Bu arayüz EXE’nin içine gömülüdür. Web sitesine yönlendirme yok. GPT-6 Astra + yerel Roblox Studio MCP Bridge.</p></div><div class="grid"><div class="card" onclick="send(\'Studioyu önce tara; hiçbir şeyi değiştirme.\')"><span class="icon">SCAN</span><h3>Studioyu Analiz Et</h3><p>DataModel, scripts, UI, map, assets, VFX/SFX ve performans.</p></div><div class="card" onclick="send(\'Boşsa 5 viral buildable Roblox oyun fikri üret, doluysa mevcut projeye özel fikirler ver.\')"><span class="icon">VIRAL</span><h3>Viral Oyun Fikirleri</h3><p>Hook, core loop, replayability ve sosyal loop.</p></div><div class="card" onclick="send(\'Studio durumunu kontrol et ve AAA plan hazırla. Henüz hiçbir değişiklik yapma.\')"><span class="icon">AAA</span><h3>AAA Plan Oluştur</h3><p>GUI, sistemler, map, data, assets, VFX, economy, mobile ve QA.</p></div></div>'+pipeline()+'<div class="panel console"><div id="messages" class="messages"></div><div class="compose"><input id="prompt" placeholder="Astra'ya doğal dilde komut ver..."><button class="btn primary" onclick="send()">Gönder</button></div></div></div>';renderMsgs();bindApproval()}
function chat(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">AI CHATBOT</div><h1>GPT-6 ASTRA</h1><p>Studio hakkında konuş, analiz ettir ve onay kapısından sonra etapları uygulat.</p></div><div class="panel console"><div id="messages" class="messages"></div><div class="compose"><input id="prompt" placeholder="Komut yaz..."><button class="btn primary" onclick="send()">Gönder</button></div></div></div>';renderMsgs()}
function bindApproval(){let a=document.getElementById('approve'),r=document.getElementById('revise');if(a)a.onclick=()=>{planPending=false;phase=3;dashboard();send('PLAN KABUL EDİLDİ. Sadece GUI TASARIMI etabını uygula. Bitince DUR, doğrula ve sonucu bildir. Sonraki etaba geçme.')} ;if(r)r.onclick=()=>{planPending=false;dashboard();send('PLAN REVİZYONU İSTENİYOR. Önce hangi maddelerin değişeceğini sor. Yeni planı tekrar onaya sun. Studioyu değiştirme.')}} 
function send(t){let i=document.getElementById('prompt');let p=(t||i?.value||'').trim();if(!p)return;add('user',p);if(i)i.value='';if(!D){add('tool','Desktop bridge API bulunamadı.');return}D.send(p).catch(e=>add('tool','[ERROR] '+e.message))}
function keys(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">SETTINGS</div><h1>API Keys</h1><p>Noxery anahtarını gir. Forge anahtarı uygulama içinden otomatik üretilebilir.</p></div><div class="panel"><div class="keys"><div class="field"><label>FORGE API KEY</label><input id="forge" value="'+esc(localStorage.getItem('forgeKey')||'')+'"></div><div class="field"><label>NOXERY API KEY</label><input id="nox" type="password" value="'+esc(localStorage.getItem('noxeryKey')||'')+'"></div></div><div class="actions"><button class="btn" id="make">Yeni Forge API Key Oluştur</button><button class="btn primary" id="save">Kaydet & Bağlan</button></div><div class="log" id="keylog"></div></div></div>';document.getElementById('make').onclick=async()=>{try{let x=await D.createKey();if(!x.ok)throw Error(x.error||'Oluşturulamadı');document.getElementById('forge').value=x.key;localStorage.setItem('forgeKey',x.key);document.getElementById('keylog').textContent='Forge API Key oluşturuldu.'}catch(e){document.getElementById('keylog').textContent='Hata: '+e.message}};document.getElementById('save').onclick=connect}
function studio(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">STUDIO INTELLIGENCE</div><h1>Roblox Studio MCP</h1><p>Yerel bridge’i başlat ve gerçek Studio analiz komutlarını çalıştır.</p></div><div class="grid"><div class="card"><h3>Connection</h3><button class="btn primary" onclick="connect()">Bridge Başlat</button><button class="btn" onclick="stop()" style="margin-left:6px">Durdur</button></div><div class="card"><h3>Quick Scan</h3><button class="btn" onclick="send('Studioyu tam tara ve teknik audit çıkar. Hiçbir şeyi değiştirme.')">Full Scan</button></div><div class="card"><h3>Policy</h3><p>Değişiklikten önce plan ve açık onay gerekir. Her etap sonrası durur.</p></div></div><div class="panel"><div id="studioLog" class="log"></div></div></div>}
function plan(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">AAA PLANNER</div><h1>Planını oluştur.</h1><p>Önce Studioyu incele; sonra uygulanabilir etaplar üret.</p></div><div class="panel"><div class="field"><label>GAME BRIEF</label><textarea id="brief" rows="8" placeholder="Örn. mobile-first anime battleground..."></textarea></div><button class="btn primary" onclick="let b=document.getElementById(\'brief\').value.trim();if(b)send(\'AAA PLAN HAZIRLA. Brief: \'+b+\'. Studioyu önce incele, değişiklik yapma, planı onaya sun.\')">AAA Planı Astra ile Oluştur</button></div></div>}
function logs(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">ACTIVITY</div><h1>Logs</h1></div><div class="panel"><div id="all" class="log" style="max-height:70vh"></div></div></div>';document.getElementById('all').textContent=msgs.map(x=>'['+x.role.toUpperCase()+'] '+x.t).join('\n\n')}
function show(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({dashboard,chat,studio,plan,logs,keys}[p]||dashboard)()}
async function connect(){let f=localStorage.getItem('forgeKey')||'',n=localStorage.getItem('noxeryKey')||'';if(document.getElementById('forge'))f=document.getElementById('forge').value.trim();if(document.getElementById('nox'))n=document.getElementById('nox').value.trim();if(!n){show('keys');add('tool','Noxery API Key gerekli.');return}localStorage.setItem('forgeKey',f);localStorage.setItem('noxeryKey',n);try{await D.start(f,n)}catch(e){add('tool','[CONNECT ERROR] '+e.message)}}
async function stop(){try{await D.stop()}catch(e){add('tool',e.message)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));document.getElementById('connect').onclick=connect;
if(D){D.onEvent(e=>{if(e.type==='state'){let s=e.state||'offline';document.getElementById('status').textContent=s.toUpperCase();document.getElementById('status').style.background=(s==='online'||s==='ready')?'#edf9f4':'#fff1f3';document.getElementById('status').style.color=(s==='online'||s==='ready')?'#14976a':'#d14e63';document.getElementById('sideState').innerHTML='Bridge '+s+'<br>Local EXE mode';}if(e.type==='log'){let t=String(e.text||'');if(t.trim()){add('tool',t);let sl=document.getElementById('studioLog');if(sl)sl.textContent+=t}}});D.status().then(s=>{if(s.state)document.getElementById('status').textContent=s.state.toUpperCase()}).catch(()=>{})}
dashboard();
</script></body></html>
