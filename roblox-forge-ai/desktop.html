let lang='tr';function t(k){return (T[lang]||T.tr)[k]||T.tr[k]||k}function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',2500)}
function add(role,t){msgs.push({role,t});if(msgs.length>100)msgs.shift();renderMsgs();D?.log('chat.message',{role,text:String(t).slice(0,500)})}
function renderMsgs(){const m=document.getElementById('messages');if(!m)return;m.innerHTML=msgs.map(x=>'<div class="msg '+x.role+'"><div class="who">'+(x.role==='user'?'YOU':x.role==='tool'?'TOOL':'ASTRA')+'</div>'+esc(x.t)+'</div>').join('');m.scrollTop=m.scrollHeight}
async function refresh(){try{snapshot=await D.snapshot();account=snapshot.account;lang=snapshot.settings?.language||lang}catch{}}

function chat(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">AI CHATBOT · GPT-6 ASTRA</div><h1>Command Center</h1><p>Studio hakkında konuş, analiz ettir veya geliştirme komutları gönder.</p></div><div class="panel console"><div class="sectionTitle"><b>'+t('auto')+'</b><label><input id="chatAuto" type="checkbox" '+(localStorage.getItem('autoDev')==='1'?'checked':'')+'> Auto Dev</label></div><div id="messages" class="messages"></div><div class="compose"><input id="prompt" placeholder="Astra\u2019ya doğal dilde komut ver..."><button class="btn primary" data-action="send">'+t('send')+'</button></div></div></div>';renderMsgs();const x=document.getElementById('chatAuto');x.onchange=()=>toggleAuto(x.checked)}
function studio(){content.innerHTML='<div class="page"><div class="hero"><div class="eyebrow">STUDIO INTELLIGENCE</div><h1>Roblox Studio MCP</h1><p>Yerel bridge’i başlat ve gerçek Studio analiz komutlarını çalıştır.</p></div><div class="grid"><div class="card"><h3>Connection</h3><button class="btn primary" data-action="connect">'+t('connect')+'</button> <button class="btn" data-action="stop">Durdur</button></div><div class="card"><h3>Quick Scan</h3><button class="btn" data-action="scan">Full Scan</button></div><div class="card"><h3>QA Loop</h3><p>Read → Build → Playtest → Output → Fix → Re-test.</p></div></div><div class="panel" style="margin-top:12px"><div id="studioLog" class="log"></div></div></div>'}

async function toggleAuto(next){localStorage.setItem('autoDev',next?'1':'0');const f=localStorage.getItem('forgeKey')||'',n=localStorage.getItem('noxeryKey')||'';if(D&&n){try{await D.stop();await new Promise(r=>setTimeout(r,250));await D.start(f,n,next);add('tool','[AUTO DEV] '+(next?'ON':'OFF'))}catch(e){add('tool','[AUTO DEV] '+e.message)}}}
function send(t){const i=document.getElementById('prompt'),p=(t||i?.value||'').trim();if(!p)return;add('user',p);if(i)i.value='';if(!D){add('tool','Desktop bridge API bulunamadı.');return}D.send(p).catch(e=>add('tool','[ERROR] '+e.message))}
async function connect(){let f=localStorage.getItem('forgeKey')||'',n=localStorage.getItem('noxeryKey')||'';const fi=document.getElementById('forge'),ni=document.getElementById('nox');if(fi)f=fi.value.trim();if(ni)n=ni.value.trim();if(!n){show('keys');toast(t('noKey'));return}localStorage.setItem('forgeKey',f);localStorage.setItem('noxeryKey',n);try{await D.start(f,n,localStorage.getItem('autoDev')==='1');toast('Bridge starting...')}catch(e){toast(e.message)}}
async function makeKey(){try{const x=await D.createKey();if(!x.ok)throw Error(x.error||'Oluşturulamadı');const f=document.getElementById('forge');if(f)f.value=x.key;localStorage.setItem('forgeKey',x.key);document.getElementById('keylog').textContent='Forge API Key oluşturuldu.'}catch(e){document.getElementById('keylog').textContent='Hata: '+e.message}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));
document.getElementById('connect').onclick=connect;
content.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-nav2],[data-lang]');if(!el)return;if(el.dataset.nav2){show(el.dataset.nav2);return}if(el.dataset.lang){lang=el.dataset.lang;await D.settings('language',lang);show('settings');toast(el.dataset.lang.toUpperCase());return}const a=el.dataset.action;e.preventDefault();
if(a==='send')send();else if(a==='connect')connect();else if(a==='stop')D.stop();else if(a==='scan')send('Studioyu önce tara; hiçbir şeyi değiştirme.');else if(a==='ideas')send('5 buildable viral Roblox oyun fikri üret.');else if(a==='aaascan')send('Studio durumunu kontrol et ve AAA plan hazırla. Henüz değişiklik yapma.');else if(a==='make-plan'){const b=document.getElementById('brief')?.value.trim();if(b)send('AAA PLAN HAZIRLA. Brief: '+b+'. Studioyu önce incele, değişiklik yapma, planı onaya sun.')}else if(a==='make-key')makeKey();else if(a==='save-key')connect();else if(a==='local-login'){account=await D.localAccount();await refresh();show('account')}else if(a==='google-login'){try{account=await D.googleLogin();await refresh();show('account');toast('Google login OK')}catch(x){toast(x.message)}}else if(a==='logout'){account=await D.logout();await refresh();show('account')}})
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='prompt'){e.preventDefault();send()}});
if(D)D.onEvent(e=>{if(e.type==='state'){const s=e.state||'offline',st=document.getElementById('status'),ss=document.getElementById('sideState');if(st){st.textContent=s.toUpperCase();st.style.background=(s==='online'||s==='ready')?'#edf9f4':'#fff1f3';st.style.color=(s==='online'||s==='ready')?'#14976a':'#d14e63'}if(ss)ss.innerHTML='Bridge '+s+'<br>Local data ready'}if(e.type==='log'){const t=String(e.text||'');if(t.trim()){add('tool',t);const sl=document.getElementById('studioLog');if(sl)sl.textContent+=t}}});
(async()=>{await refresh();header();dashboard()})();
</script>
</body></html>
