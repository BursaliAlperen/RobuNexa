<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RobuNexa | Shortlink Rewards</title>
    <meta name="theme-color" content="#050505">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#050505',
                        surface: '#0F1115',
                        primary: '#FACC15', 
                        accent: '#EA580C', 
                        robux: '#00b06f',
                        success: '#10B981',
                        error: '#EF4444'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Icons & Fonts & Flags -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.11.0/css/flag-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Base Reset */
        body {
            background-color: #050505;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .static-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(250, 204, 21, 0.05), transparent 25%);
            background-size: cover;
            z-index: -10;
            pointer-events: none;
        }

        .glass {
            background: rgba(15, 17, 21, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .robux-icon { filter: drop-shadow(0 0 5px rgba(0, 176, 111, 0.4)); }
        .click-bounce:active { transform: scale(0.96); }
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { pointer-events: all; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateX(0); }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        #lang-modal, #promo-modal { transition: opacity 0.3s ease; pointer-events: none; opacity: 0; }
        #lang-modal.active, #promo-modal.active { opacity: 1; pointer-events: all; }

        #transition-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #050505;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #transition-overlay.active { opacity: 1; pointer-events: all; }
        
        .faq-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .faq-item.active .faq-content { max-height: 1000px; }
        .faq-item.active i { transform: rotate(180deg); color: #FACC15; }

        /* LIVE TICKER ANIMATION */
        .ticker-wrap {
            position: fixed; top: 0; left: 0; width: 100%; overflow: hidden; height: 32px; 
            background: rgba(250, 204, 21, 0.1); border-bottom: 1px solid rgba(250, 204, 21, 0.2);
            z-index: 40; pointer-events: none; display: flex; align-items: center;
            backdrop-filter: blur(4px);
        }
        .ticker { display: flex; white-space: nowrap; animation: ticker 45s linear infinite; }
        .ticker-item { 
            display: inline-flex; align-items: center; gap: 6px; padding: 0 1.5rem; 
            color: #FACC15; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; font-weight: bold; 
        }
        .ticker-item span { color: #fff; opacity: 0.8; }
        
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- SECURITY & UTILS -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) { e.preventDefault(); return false; }
        });
    </script>

    <!-- ICONS -->
    <svg style="display: none;">
        <symbol id="icon-full-noob" viewBox="0 0 100 120">
            <rect x="5" y="35" width="20" height="40" rx="5" fill="#FACC15" stroke="black" stroke-width="2"/>
            <rect x="75" y="35" width="20" height="40" rx="5" fill="#FACC15" stroke="black" stroke-width="2"/>
            <rect x="28" y="75" width="18" height="40" rx="4" fill="#4ADE80" stroke="black" stroke-width="2"/>
            <rect x="54" y="75" width="18" height="40" rx="4" fill="#4ADE80" stroke="black" stroke-width="2"/>
            <rect x="25" y="35" width="50" height="45" rx="5" fill="#3B82F6" stroke="black" stroke-width="2"/>
            <g>
                <rect x="30" y="5" width="40" height="35" rx="8" fill="#FACC15" stroke="black" stroke-width="2"/>
                <circle cx="43" cy="20" r="3" fill="black"/>
                <circle cx="57" cy="20" r="3" fill="black"/>
                <path d="M 45 28 Q 50 32 55 28" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>
        </symbol>
        <symbol id="icon-robux" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#00b06f" stroke="#008050" stroke-width="2"/>
            <path d="M50 10 A40 40 0 0 1 50 90 A40 40 0 0 1 50 10" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
            <text x="50" y="65" font-family="'Inter', sans-serif" font-weight="900" font-size="45" text-anchor="middle" fill="white" style="text-shadow: 0 2px 4px rgba(0,0,0,0.3);">R$</text>
        </symbol>
    </svg>

    <div class="static-bg"></div>
    <div id="toast-container"></div>

    <!-- LIVE TICKER -->
    <div class="ticker-wrap hidden md:flex">
        <div class="ticker" id="ticker-content">
            <!-- JS Will Fill This with Infinite Unique Users -->
        </div>
    </div>

    <!-- MODALS -->
    <div id="lang-modal" class="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass w-full max-w-lg rounded-2xl p-6 border border-white/10 flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 flex-shrink-0">
                <h3 class="text-white font-bold text-lg" data-t="select_lang">Select Language</h3>
                <button onclick="toggleLangModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center click-bounce"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto p-1" id="lang-grid"></div>
        </div>
    </div>

    <div id="promo-modal" class="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 backdrop-blur-sm hidden">
        <div class="glass w-full max-w-sm rounded-2xl p-6 border border-white/10 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/20 rounded-full blur-2xl animate-pulse-slow"></div>
            <div class="flex justify-between items-center mb-6 relative z-10">
                <h3 class="text-white font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-ticket text-primary"></i> <span data-t="promo_title">Promo Code</span></h3>
                <button onclick="togglePromoModal(false)" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center click-bounce"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4 relative z-10">
                <input type="text" id="promo-input" placeholder="CODE" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-center text-white font-mono uppercase tracking-widest focus:border-primary outline-none transition-colors">
                <button onclick="redeemCode()" class="w-full bg-primary text-black font-bold py-3 rounded-xl click-bounce shadow-lg shadow-primary/20" data-t="redeem_btn">REDEEM</button>
            </div>
        </div>
    </div>

    <!-- LOADERS -->
    <div id="transition-overlay">
        <svg class="w-24 h-24 animate-float"><use href="#icon-full-noob"></use></svg>
        <div class="mt-4 flex flex-col items-center gap-2">
            <span class="text-xs font-bold text-white tracking-widest uppercase font-mono" data-t="loading">LOADING...</span>
            <div class="w-32 h-1 bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-primary w-1/2 animate-[pulse_0.5s_infinite]"></div>
            </div>
        </div>
    </div>

    <div id="app-loader" class="fixed inset-0 bg-[#050505] z-[140] flex flex-col items-center justify-center transition-opacity duration-500">
        <svg class="w-32 h-32 animate-float mb-4"><use href="#icon-full-noob"></use></svg>
    </div>

    <!-- AUTH SCREEN -->
    <section id="auth-view" class="hidden min-h-screen flex flex-col items-center justify-center p-6 relative z-10 py-12">
        <button onclick="toggleLangModal()" class="absolute top-6 right-6 w-10 h-10 rounded-full glass flex items-center justify-center hover:bg-white/10 transition z-20 overflow-hidden click-bounce">
            <span id="auth-flag-icon" class="fi fi-us rounded-full text-xl"></span>
        </button>
        <div class="glass p-8 rounded-3xl w-full max-w-sm text-center border-t border-primary/20 shadow-2xl shadow-primary/5 mb-8 transform transition hover:scale-[1.01]">
            <svg class="w-24 h-24 mx-auto mb-4 animate-float"><use href="#icon-full-noob"></use></svg>
            <h1 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Robu<span class="text-primary">Nexa</span></h1>
            <p class="text-gray-400 text-sm mb-8 leading-relaxed font-mono" data-t="auth_desc">Join the Elite.<br>Earn Real Robux Instantly.</p>
            <button id="btn-login" class="w-full bg-white text-black font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-100 transition-all click-bounce">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> <span data-t="login_btn">Login with Google</span>
            </button>
        </div>
        <!-- FAQ -->
        <div class="w-full max-w-lg space-y-3 pb-8">
            <h3 class="text-center text-xs font-bold text-gray-500 uppercase tracking-widest mb-4" data-t="faq_title">FAQ & Help</h3>
            <div class="faq-item glass rounded-xl overflow-hidden cursor-pointer group" onclick="toggleFaq(this)">
                <div class="p-4 flex justify-between items-center group-hover:bg-white/5 transition"><span class="text-sm font-bold text-white" data-t="q1">Is this free?</span> <i class="fa-solid fa-chevron-down text-gray-500 text-xs transition-transform duration-300"></i></div>
                <div class="faq-content bg-black/30"><p class="p-4 text-xs text-gray-400 font-mono leading-relaxed" data-t="a1">RobuNexa is free. Visit shortlinks, get paid.</p></div>
            </div>
        </div>
    </section>

    <!-- MAIN INTERFACE -->
    <div id="main-view" class="hidden min-h-screen relative z-10 flex flex-col md:flex-row pt-[32px] md:pt-[32px]">
        <!-- Sidebar -->
        <aside class="hidden md:flex flex-col w-64 h-screen glass fixed left-0 top-0 border-r border-white/5 z-20 pt-[32px]">
            <button onclick="router.navigate('home')" class="p-6 flex items-center gap-3 justify-center border-b border-white/5 hover:bg-white/5 transition cursor-pointer w-full group">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-black font-bold text-lg group-hover:rotate-12 transition-transform">R</div>
                <span class="font-bold text-lg tracking-tight">Robu<span class="text-primary">Nexa</span></span>
            </button>
            <div class="flex-1 px-3 py-4 space-y-1">
                <button onclick="router.navigate('home')" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition flex items-center gap-3" data-target="home"><i class="fa-solid fa-house w-5"></i> <span data-t="menu_home" class="text-sm">Dashboard</span></button>
                <button onclick="router.navigate('earn')" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition flex items-center gap-3" data-target="earn"><i class="fa-solid fa-link w-5"></i> <span data-t="menu_tasks" class="text-sm">Shortlinks</span></button>
                <button onclick="router.navigate('chat')" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition flex items-center gap-3" data-target="chat"><i class="fa-solid fa-comments w-5"></i> <span data-t="menu_chat" class="text-sm">Global Chat</span></button>
                <button onclick="router.navigate('withdraw')" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition flex items-center gap-3" data-target="withdraw"><i class="fa-solid fa-money-bill-transfer w-5"></i> <span data-t="menu_withdraw" class="text-sm">Withdraw</span></button>
                <button onclick="router.navigate('leaderboard')" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition flex items-center gap-3" data-target="leaderboard"><i class="fa-solid fa-trophy w-5"></i> <span data-t="menu_top" class="text-sm">Leaderboard</span></button>
                <button onclick="router.navigate('profile')" class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition flex items-center gap-3" data-target="profile"><i class="fa-solid fa-user w-5"></i> <span data-t="menu_profile" class="text-sm">Profile</span></button>
                <button id="nav-admin" onclick="router.navigate('admin')" class="hidden w-full text-left px-4 py-3 rounded-xl bg-red-900/10 text-red-500 hover:bg-red-900/30 transition flex items-center gap-3 border border-red-500/20 mt-4"><i class="fa-solid fa-shield-halved w-5"></i> <span data-t="menu_admin" class="text-sm">Admin Panel</span></button>
            </div>
            <div class="p-4 border-t border-white/5">
                 <button onclick="toggleLangModal()" class="w-full glass py-2 rounded-lg text-xs text-gray-400 hover:text-white flex items-center justify-center gap-2 click-bounce">
                    <span id="sidebar-flag-icon" class="fi fi-us rounded-sm"></span> <span id="current-lang-name">English</span>
                </button>
            </div>
        </aside>

        <!-- Content -->
        <div class="flex-1 md:ml-64 pb-24 md:pb-0">
            <!-- Mobile Header -->
            <header class="glass sticky top-[32px] md:top-0 z-30 px-4 py-3 flex justify-between items-center border-b border-white/5 md:hidden backdrop-blur-xl">
                <div class="flex items-center gap-2" onclick="router.navigate('home')">
                    <div class="w-8 h-8 rounded-lg bg-primary/20 flex items-center justify-center border border-primary/50"><i class="fa-solid fa-cube text-primary text-sm"></i></div>
                    <span class="font-bold text-lg">Robu<span class="text-primary">Nexa</span></span>
                </div>
                <div class="bg-surface/90 px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-2 shadow-inner shadow-black/50">
                    <svg class="w-5 h-5 robux-icon"><use href="#icon-robux"></use></svg>
                    <span id="header-balance" class="font-mono font-bold text-sm text-white">0.00</span>
                </div>
            </header>

            <!-- Desktop Header -->
            <header class="hidden md:flex justify-between items-center px-8 py-6 glass sticky top-0 z-30 border-b border-white/5 backdrop-blur-xl">
                <div>
                    <h2 id="page-title" class="text-2xl font-bold text-white">Dashboard</h2>
                    <p class="text-xs text-gray-500 font-mono" data-t="welcome">Welcome back, Earner.</p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="bg-surface/80 px-5 py-2 rounded-full border border-white/10 flex items-center gap-3 shadow-lg shadow-black/20 hover:border-robux/50 transition-colors cursor-pointer group hover:bg-white/5">
                        <svg class="w-8 h-8 robux-icon group-hover:scale-110 transition-transform"><use href="#icon-robux"></use></svg>
                        <span id="desktop-balance" class="font-mono font-bold text-xl text-white">0.00</span>
                    </div>
                    <img id="user-avatar" src="" referrerpolicy="no-referrer" onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'" class="w-10 h-10 rounded-full border-2 border-white/10 hover:border-primary transition-colors cursor-pointer" onclick="router.navigate('profile')">
                </div>
            </header>

            <main id="app-content" class="p-4 md:p-8 max-w-6xl mx-auto"></main>
        </div>

        <!-- Mobile Bottom Nav -->
        <nav class="fixed bottom-0 left-0 w-full glass border-t border-white/5 z-40 md:hidden pb-safe">
            <div class="grid grid-cols-5 h-16 items-center justify-items-center relative">
                <button onclick="router.navigate('home')" class="nav-item group flex flex-col items-center gap-1 w-full" data-target="home">
                    <i class="fa-solid fa-house text-lg text-gray-500 transition-colors"></i> <span class="text-[9px] text-gray-500" data-t="menu_home">Home</span>
                </button>
                <button onclick="router.navigate('earn')" class="nav-item group flex flex-col items-center gap-1 w-full" data-target="earn">
                    <i class="fa-solid fa-link text-lg text-gray-500 transition-colors"></i> <span class="text-[9px] text-gray-500" data-t="menu_tasks">Tasks</span>
                </button>
                <button onclick="router.navigate('chat')" class="relative -top-6 click-bounce">
                    <div class="w-14 h-14 bg-gradient-to-br from-primary to-accent rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(250,204,21,0.4)] border-4 border-[#050505] z-50">
                        <i class="fa-solid fa-comments text-black text-xl"></i>
                    </div>
                </button>
                <button onclick="router.navigate('leaderboard')" class="nav-item group flex flex-col items-center gap-1 w-full" data-target="leaderboard">
                    <i class="fa-solid fa-trophy text-lg text-gray-500 transition-colors"></i> <span class="text-[9px] text-gray-500" data-t="menu_top">Top</span>
                </button>
                <button onclick="router.navigate('profile')" class="nav-item group flex flex-col items-center gap-1 w-full" data-target="profile">
                    <i class="fa-solid fa-user text-lg text-gray-500 transition-colors"></i> <span class="text-[9px] text-gray-500" data-t="menu_profile">Me</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- TEMPLATES -->
    <template id="tpl-home">
        <div class="fade-in space-y-6">
            <div class="glass relative overflow-hidden rounded-3xl p-6 md:p-10 border border-primary/20 group">
                <div class="absolute -right-16 -top-16 w-56 h-56 bg-primary/10 rounded-full blur-3xl group-hover:bg-primary/20 transition-colors duration-500"></div>
                <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">

                        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 block" data-t="total_bal">Total Balance</span>
                        <div class="flex items-center justify-center md:justify-start gap-3 mb-6">
                            <svg class="w-12 h-12 md:w-16 md:h-16 robux-icon animate-pulse-slow"><use href="#icon-robux"></use></svg>
                            <span class="text-5xl md:text-6xl font-black text-white tracking-tighter" id="home-big-balance">0.00</span>
                        </div>
                        <div class="flex gap-3 justify-center md:justify-start">
                            <button onclick="router.navigate('earn')" class="bg-gradient-to-r from-primary to-accent text-black font-bold py-3.5 px-8 rounded-xl click-bounce shadow-lg shadow-primary/20 hover:shadow-primary/40 transition-shadow">
                                <span data-t="start_earn">Start Earning</span>
                            </button>

                                <i class="fa-solid fa-ticket text-primary"></i> <span class="hidden md:inline" data-t="code_btn">Code</span>
                            </button>

                    </div>

                        <svg class="w-40 h-40 animate-float relative z-10"><use href="#icon-full-noob"></use></svg>
                    </div>
                </div>
            </div>
            <div class="glass p-4 rounded-2xl border border-yellow-500/20 bg-yellow-900/10 flex justify-between items-center cursor-pointer hover:bg-yellow-900/20 transition" id="daily-bonus-card" onclick="claimDaily()">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-yellow-500/20 flex items-center justify-center text-yellow-500 animate-pulse"><i class="fa-solid fa-calendar-check"></i></div>
                    <div>
                        <h4 class="font-bold text-white text-sm" data-t="daily_title">Daily Bonus</h4>
                        <p class="text-[10px] text-gray-400 font-mono" id="daily-timer" data-t="daily_desc">Claim +10 R$ every 24h</p>
                    </div>
                </div>
                <button class="bg-yellow-500 text-black font-bold px-3 py-1 rounded text-xs click-bounce">CLAIM</button>
            </div>
            <div class="grid grid-cols-2 gap-3 md:gap-6">
                <div class="glass p-5 rounded-2xl border border-white/5 hover:border-blue-500/30 transition-colors">
                    <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center mb-3 text-blue-400"><i class="fa-solid fa-check-circle text-xl"></i></div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-mono" data-t="completed_stat">Completed</p>
                    <p class="text-2xl font-bold text-white mt-1" id="home-tasks">0</p>
                </div>
                <div class="glass p-5 rounded-2xl border border-white/5 hover:border-purple-500/30 transition-colors">
                    <div class="w-10 h-10 rounded-lg bg-purple-500/20 flex items-center justify-center mb-3 text-purple-400"><i class="fa-solid fa-bolt text-xl"></i></div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-mono" data-t="xp_level">XP Level</p>
                    <p class="text-2xl font-bold text-white mt-1" id="home-xp">0</p>
                </div>
            </div>
        </div>
    </template>

            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 3000);
        };

        const animateValue = (obj, start, end, duration) => {
            if(!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = (start + progress * (end - start)).toFixed(2);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        };

        window.claimDaily = async () => {
            playSound('click');
            const now = Date.now();
            const lastBonus = state.data.lastBonusAt ? state.data.lastBonusAt.seconds * 1000 : 0;
            const diff = now - lastBonus;
            const hours24 = 24 * 60 * 60 * 1000;
            if (diff >= hours24) {
                await updateDoc(doc(db,"users",state.user.uid), { balance: increment(10), lastBonusAt: serverTimestamp() });
                toast("Daily Bonus Claimed! +10 R$", "success");
            } else {
                const waitHours = Math.ceil((hours24 - diff) / (1000 * 60 * 60));
                toast(`Wait ${waitHours} hours.`, "error");
            }
        };

        // ROUTER
        const router = {
            navigate: (view) => {
                playSound('click');
                const overlay = document.getElementById('transition-overlay');
                overlay.classList.add('active'); 

                if(chatUnsub) { chatUnsub(); chatUnsub = null; }

                document.querySelectorAll('.nav-item i').forEach(el => el.className = el.className.replace('text-primary','text-gray-500'));
                document.querySelectorAll('.nav-item span').forEach(el => el.classList.remove('text-primary'));
                const activeBtn = document.querySelector(`.nav-item[data-target="${view}"] i`);
                if(activeBtn) { activeBtn.classList.remove('text-gray-500'); activeBtn.classList.add('text-primary'); activeBtn.nextElementSibling?.classList.add('text-primary'); }
                document.querySelectorAll('.nav-btn').forEach(el => { el.classList.remove('bg-white/10','text-white'); el.classList.add('text-gray-400'); });
                const deskBtn = document.querySelector(`.nav-btn[data-target="${view}"]`);
                if(deskBtn) { deskBtn.classList.remove('text-gray-400'); deskBtn.classList.add('bg-white/10','text-white'); }

                setTimeout(() => {
                    const content = document.getElementById('app-content');
                    const tpl = document.getElementById(`tpl-${view}`);
                    if (tpl) {
                        content.innerHTML = '';
                        content.appendChild(tpl.content.cloneNode(true));
                        
                        const titles = { home:'menu_home', earn:'menu_tasks', chat:'menu_chat', withdraw:'menu_withdraw', leaderboard:'menu_top', profile:'menu_profile', admin:'admin_console' };
                        const pt = document.getElementById('page-title');
                        if(pt) pt.innerText = t(titles[view]) || 'App';

                        if(view === 'home') initHome();
                        if(view === 'earn') initEarn();
                        if(view === 'chat') initChat();
                        if(view === 'withdraw') initWithdraw();
                        if(view === 'leaderboard') initLeaderboard();
                        if(view === 'profile') initProfile();
                        if(view === 'admin') initAdmin();

                        updateLanguage(curLang);
                        window.scrollTo(0,0);
                    }
                    setTimeout(() => overlay.classList.remove('active'), 300);
                }, 400);
            }
        };

        const initHome = () => {
            if(!state.data) return;
            const balEl = document.getElementById('home-big-balance');
            if(balEl) balEl.innerText = state.data.balance.toFixed(2);
            document.getElementById('home-tasks').innerText = (state.data.completedTasks || []).length;
            document.getElementById('home-xp').innerText = state.data.xp || 0;
        };

        const initEarn = async () => {
            const list = document.getElementById('task-list');
            const q = query(collection(db, "pages"), where("active", "==", true), orderBy("reward", "desc"));
            const snaps = await getDocs(q);
            list.innerHTML = '';
            if(snaps.empty) list.innerHTML = `<div class="col-span-full text-center text-gray-500 text-xs py-10 font-mono">${t('loading')}</div>`;
            
            snaps.forEach(d => {
                const tData = d.data();
                const isDone = state.data.completedTasks?.includes(d.id);
                const el = document.createElement('div');
                el.className = `glass p-4 rounded-2xl border ${isDone?'border-green-500/20 bg-green-900/10':'border-white/10 hover:border-primary/50'} transition-all group`;
                el.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="text-primary font-bold flex items-center gap-1 font-mono text-lg group-hover:scale-110 transition-transform"><svg class="w-4 h-4 robux-icon"><use href="#icon-robux"></use></svg> +${tData.reward}</span>
                        ${isDone ? '<i class="fa-solid fa-check-circle text-success"></i>' : ''}
                    </div>
                    <h4 class="font-bold text-sm text-white">${tData.title}</h4>
                    <p class="text-[10px] text-gray-500 mb-3 font-mono">${tData.description}</p>
                    <button class="btn-start w-full py-2.5 rounded-xl text-xs font-bold ${isDone?'bg-white/5 text-gray-500 cursor-not-allowed':'bg-primary text-black hover:bg-yellow-400 click-bounce shadow-lg shadow-primary/20'}" data-id="${d.id}" data-r="${tData.reward}" ${isDone?'disabled':''}>${isDone?t('btn_done'):t('btn_start')}</button>
                `;
                list.appendChild(el);
            });

            document.querySelectorAll('.btn-start').forEach(b => {
                b.onclick = async () => {
                    if(b.disabled) return;
                    playSound('click');
                    if(state.data.lastTaskAt && (Date.now()-state.data.lastTaskAt.seconds*1000)/1000 < 10) return toast('Wait 10s', 'error');
                    window.open('https://google.com', '_blank'); 
                    toast('Checking...', 'info');
                    setTimeout(async()=>{
                        await updateDoc(doc(db,"users",state.user.uid), { balance: increment(Number(b.dataset.r)), xp: increment(10), completedTasks:[...state.data.completedTasks||[], b.dataset.id], lastTaskAt: serverTimestamp() });
                        toast(`+${b.dataset.r} R$ Added!`, 'success');
                        initEarn();
                    }, 4000);
                }
            });
        };

        const initChat = () => {
            const chatDiv = document.getElementById('chat-messages');
            const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(30));
            
            chatUnsub = onSnapshot(q, (snapshot) => {
                chatDiv.innerHTML = '';
                const msgs = [];
                snapshot.forEach(doc => msgs.push(doc.data()));
                msgs.reverse().forEach(m => {
                    const isMe = m.uid === state.user.uid;
                    const el = document.createElement('div');
                    el.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                    el.innerHTML = `
                        <div class="max-w-[80%] ${isMe ? 'bg-primary text-black' : 'bg-white/10 text-white'} rounded-xl px-3 py-2 text-xs">
                            <span class="block font-bold opacity-50 text-[10px] mb-1">${m.name}</span>
                            ${m.text}
                        </div>
                    `;
                    chatDiv.appendChild(el);
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            });

            window.sendMessage = async () => {
                const inp = document.getElementById('chat-input');
                const txt = inp.value.trim();
                if(!txt) return;
                inp.value = '';
                await addDoc(collection(db, "messages"), {
                    uid: state.user.uid,
                    name: state.user.displayName || "User",
                    text: txt,
                    createdAt: serverTimestamp()
                });
            };
            
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') window.sendMessage();
            });
        };

        const initWithdraw = async () => {
            const hist = document.getElementById('withdraw-history');
            const snaps = await getDocs(query(collection(db,"withdrawals"), where("uid","==",state.user.uid), orderBy("createdAt","desc"), limit(5)));
            hist.innerHTML = '';
            snaps.forEach(s => {
                const d = s.data();
                const statusKey = `status_${d.status}`;
                hist.innerHTML += `<div class="flex justify-between p-3 bg-white/5 rounded-xl text-xs border border-white/5"><span class="text-white font-bold">${d.amount} R$</span><span class="uppercase font-bold ${d.status==='approved'?'text-success':d.status==='rejected'?'text-error':'text-primary'}">${t(statusKey)}</span></div>`;
            });
            document.getElementById('withdraw-form').onsubmit = async (e) => {
                e.preventDefault();
                playSound('click');
                const amt = Number(document.getElementById('w-amount').value);
                if(amt<50 || state.data.balance<amt) return toast('Insufficient Funds (Min 50)', 'error');
                
                // Process Withdrawal
                await updateDoc(doc(db,"users",state.user.uid),{balance:increment(-amt), lastWithdrawAt:serverTimestamp()});
                await addDoc(collection(db,"withdrawals"),{uid:state.user.uid, amount:amt, gamepassLink:document.getElementById('w-link').value, status:'pending', createdAt:serverTimestamp(), email:state.user.email});
                
                // TRIGGER LIVE TICKER UPDATE
                const userName = state.user.displayName || "You";
                const eventHtml = `<i class="fa-solid fa-circle-check text-success"></i> <span>${userName}</span> just withdrew <span class="text-white font-bold">${amt} R$</span>`;
                populateTicker(eventHtml);
                
                toast('Request Sent!', 'success'); initWithdraw();
            };
        };

        const initAdmin = async () => {
            if(!state.isAdmin) return router.navigate('home');
            
            window.adminSearchUser = async () => {
                const val = document.getElementById('adm-user-search').value.trim();
                if(!val) return toast("Enter Email or UID", "error");
                let q = query(collection(db, "users"), where("email", "==", val));
                let snaps = await getDocs(q);
                if(snaps.empty) { q = query(collection(db, "users"), where("uid", "==", val)); snaps = await getDocs(q); }
                if(snaps.empty) return toast("User not found", "error");
                const d = snaps.docs[0];
                window.selectedAdminUser = { id: d.id, ...d.data() };
                document.getElementById('adm-res-uid').innerText = "UID: " + d.id;
                document.getElementById('adm-res-email').innerText = window.selectedAdminUser.email;
                document.getElementById('adm-res-bal').value = window.selectedAdminUser.balance;
                document.getElementById('adm-user-result').classList.remove('hidden');
            };

            window.adminUpdateBalance = async () => {
                if(!window.selectedAdminUser) return;
                const newBal = Number(document.getElementById('adm-res-bal').value);
                await updateDoc(doc(db, "users", window.selectedAdminUser.id), { balance: newBal });
                toast("Balance Updated!", "success");
            };

            // Withdrawals
            const list = document.getElementById('admin-withdraw-list');
            const pSnaps = await getDocs(query(collection(db,"withdrawals"), where("status","==","pending")));
            list.innerHTML='';
            if(pSnaps.empty) list.innerHTML = `<p class="text-gray-500">${t('loading')}</p>`;
            
            pSnaps.forEach(s => {
                const d = s.data();
                const div = document.createElement('div');
                div.className="glass p-4 rounded-xl text-xs border border-white/10";
                div.innerHTML=`
                    <div class="flex justify-between mb-2"><span class="text-white font-bold text-lg">${d.amount} R$</span><span class="text-gray-400 font-mono">${d.email}</span></div>
                    <a href="${d.gamepassLink}" target="_blank" class="text-blue-400 hover:underline mb-3 block truncate"><i class="fa-solid fa-external-link"></i> ${d.gamepassLink}</a>
                    <div class="flex gap-2">
                        <button class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg font-bold flex-1 b-a">${t('approve')}</button>
                        <button class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg font-bold flex-1 b-r">${t('reject')}</button>
                    </div>`;
                div.querySelector('.b-a').onclick=async()=>{ await updateDoc(doc(db,"withdrawals",s.id),{status:'approved'}); div.remove(); toast('Approved','success'); };
                div.querySelector('.b-r').onclick=async()=>{ await updateDoc(doc(db,"withdrawals",s.id),{status:'rejected'}); await updateDoc(doc(db,"users",d.uid),{balance:increment(d.amount)}); div.remove(); toast('Refunded','info'); };
                list.appendChild(div);
            });
            
            // Stats
            const usersSnap = await getDocs(collection(db, "users"));
            document.getElementById('adm-total-users').innerText = usersSnap.size;
            
            document.getElementById('add-task-form').onsubmit = async (e) => {
                e.preventDefault();
                await addDoc(collection(db,"pages"),{
                    title: document.getElementById('t-title').value, description: document.getElementById('t-desc').value,
                    reward: Number(document.getElementById('t-reward').value), cooldown: Number(document.getElementById('t-cooldown').value),
                    active: true, createdAt: serverTimestamp()
                });
                toast('Task Added','success'); e.target.reset();
            };
        };

        const initLeaderboard = async () => {
            const tb = document.getElementById('leaderboard-body');
            const snaps = await getDocs(query(collection(db,"users"), orderBy("balance","desc"), limit(20)));
            tb.innerHTML = '';
            let i=1;
            snaps.forEach(s => {
                const d = s.data();
                tb.innerHTML += `<tr><td class="p-4 text-primary font-bold">${i++}</td><td class="p-4 flex gap-2 items-center"><img src="${d.photoURL}" class="w-6 h-6 rounded-full" onerror="this.src='https://ui-avatars.com/api/?name=U'"> ${d.email.slice(0,3)}...</td><td class="p-4 text-right font-bold text-white">${d.balance.toFixed(0)}</td></tr>`;
            });
        };

        const initProfile = () => {
            document.getElementById('profile-img').src = state.user.photoURL;
            document.getElementById('profile-name').innerText = state.user.displayName || "User";
            document.getElementById('profile-email').innerText = state.user.email;
            document.getElementById('profile-id').innerText = state.user.uid;
            
            const refLink = `https://robunexa.com?ref=${state.user.uid}`;
            document.getElementById('ref-link').value = refLink;
            
            window.copyRef = () => { navigator.clipboard.writeText(refLink); toast('Copied!', 'success'); };
            document.getElementById('btn-logout').onclick = () => { playSound('click'); signOut(auth); location.reload(); };
        };

        window.redeemCode = async () => {
            playSound('click');
            const input = document.getElementById('promo-input');
            const code = input.value.trim().toUpperCase();
            if(!code) return toast("Empty Code", "error");
            togglePromoModal(false);
            const demoCodes = { "ROBUX2024": 50, "WELCOME": 25 };
            if(state.data.usedCodes && state.data.usedCodes.includes(code)) return toast("Already Used!", "error");
            if(demoCodes[code]) {
                await updateDoc(doc(db, "users", state.user.uid), { balance: increment(demoCodes[code]), usedCodes: [...(state.data.usedCodes || []), code] });
                toast(`Redeemed ${demoCodes[code]} R$!`, "success");
            } else { toast("Invalid Code", "error"); }
        };

        onAuthStateChanged(auth, async (user) => {
            const loader = document.getElementById('app-loader');
            if (user) {
                state.user = user;
                if (ADMIN_EMAILS.includes(user.email)) {
                    state.isAdmin = true;
                    document.getElementById('nav-admin').classList.remove('hidden');
                }

                const ref = doc(db,"users",user.uid);
                const snap = await getDoc(ref);
                if(!snap.exists()) {
                    await setDoc(ref,{uid:user.uid, email:user.email, balance:0, xp:0, photoURL:user.photoURL, completedTasks:[], usedCodes:[], referralCount:0, createdAt:serverTimestamp()});
                    state.data = {balance:0, completedTasks:[], usedCodes:[]};
                } else state.data = snap.data();
                
                onSnapshot(ref, (d) => {
                    if(d.exists()) {
                        const newData = d.data();
                        const newBal = newData.balance;
                        animateValue(document.getElementById('header-balance'), prevBalance, newBal, 1000);
                        animateValue(document.getElementById('desktop-balance'), prevBalance, newBal, 1000);
                        const homeBig = document.getElementById('home-big-balance');
                        if(homeBig) animateValue(homeBig, prevBalance, newBal, 1000);
                        if(newBal > prevBalance && prevBalance !== 0) playSound('success');
                        prevBalance = newBal;
                        state.data = newData;
                    }
                });
                
                document.getElementById('user-avatar').src = user.photoURL;
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                populateTicker(); // START FAKE STREAM
                updateLanguage(curLang);
                router.navigate('home');
            } else {
                state = {user:null, data:null};
                document.getElementById('main-view').classList.add('hidden');
                document.getElementById('auth-view').classList.remove('hidden');
                updateLanguage(curLang);
            }
            setTimeout(() => { loader.style.opacity='0'; setTimeout(()=>loader.remove(),500); }, 1000);
        });

        document.getElementById('btn-login').onclick = () => { playSound('click'); signInWithPopup(auth, provider).catch(e => toast(e.message, 'error')); };
        window.router = router;
    </script>
</body>
</html>
