name: Convert Gojo and movement RBXM animations
on:
  push:
    branches: [main]
    paths:
      - "content/models/**/*.rbxm"
      - "content/animations/Gojo/Sokamona.anim"
      - "tools/convert_gojo_rbxm.py"
      - ".github/workflows/convert-gojo-animations.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RBXM parser
        run: python -m pip install "git+https://github.com/Ghosteined/rbxm_parser.git"
      - name: Convert Gojo and movement KeyframeSequences
        run: python tools/convert_gojo_rbxm.py
      - name: Commit converted animation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/animations/Gojo
          if git diff --cached --quiet; then
            echo "No converted animation changes."
          else
            git commit -m "Convert Gojo movement RBXM assets to AnimLib animations"
            # Other direct GitHub edits can land while conversion runs; rebase before pushing.
            git pull --rebase origin main
            git push
          fi
