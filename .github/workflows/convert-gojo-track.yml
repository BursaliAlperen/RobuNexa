name: Convert Gojo, Purple and Cid animations for NAM

on:
  push:
    branches: [main]
    paths:
      - "content/GojoAwaken.anim"
      - "GojoAwaken.anim"
      - "HollowPurple1.anim"
      - "MahoragaDestroyPurple.anim"
      - "CidOverdrive.anim"
      - "tools/convert_gojo_animation.py"
      - ".github/workflows/convert-gojo-track.yml"

permissions:
  contents: write

jobs:
  convert-animation-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RBXM parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install zstandard
          python -m pip install git+https://github.com/Ghosteined/rbxm_parser.git
      - name: Convert uploaded KeyframeSequences
        run: |
          python tools/convert_gojo_animation.py content/GojoAwaken.anim content/GojoAwakeTrack.anim
          python tools/convert_gojo_animation.py HollowPurple1.anim content/HollowPurple1Track.anim
          python tools/convert_gojo_animation.py MahoragaDestroyPurple.anim content/MahoragaDestroyPurpleTrack.anim
          python tools/convert_gojo_animation.py CidOverdrive.anim content/CidOverdriveTrack.anim
      - name: Commit converted AnimLib tracks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/GojoAwakeTrack.anim content/HollowPurple1Track.anim content/MahoragaDestroyPurpleTrack.anim content/CidOverdriveTrack.anim
          if git diff --cached --quiet; then
            echo "Tracks are already converted; no commit needed."
            exit 0
          fi
          git commit -m "Convert Gojo, Purple and Cid animations to AnimLib tracks"
          git pull --rebase origin main
          git push origin HEAD:main
