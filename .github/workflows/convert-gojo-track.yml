name: Convert NAM animation tracks

on:
  push:
    branches: [main]
    paths:
      - "MaximumHollowPurple.anim"
      - "content/GojoAwakening.anim"
      - "CidOverdrive.anim"
      - "sukunaAwaken.anim"
      - "Sokamona.anim"
      - "tools/convert_gojo_animation.py"
      - ".github/workflows/convert-gojo-track.yml"

permissions:
  contents: write

jobs:
  convert-animation-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RBXM parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install zstandard
          python -m pip install git+https://github.com/Ghosteined/rbxm_parser.git

      - name: Convert each source and collect diagnostics
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          jobs = [
              ("content/GojoAwakening.anim", "content/GojoAwakeningTrack.anim"),
              ("MaximumHollowPurple.anim", "content/MaximumHollowPurpleTrack.anim"),
              ("CidOverdrive.anim", "content/CidOverdriveTrack.anim"),
              ("sukunaAwaken.anim", "content/SukunaAwakeningTrack.anim"),
              ("Sokamona.anim", "content/SokamonaTrack.anim"),
          ]
          report = ["# NAM animation conversion report", ""]
          for source, output in jobs:
              out_path = Path(output)
              try:
                  result = subprocess.run(
                      ["python", "tools/convert_gojo_animation.py", source, output],
                      text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      check=False,
                  )
                  log = (result.stdout or "").strip()
                  valid = False
                  validation_error = "output missing"
                  if out_path.is_file() and out_path.stat().st_size > 0:
                      try:
                          document = json.loads(out_path.read_text(encoding="utf-8"))
                          frames = document.get("Keyframes", [])
                          poses = sum(
                              len(frame.get("Poses", []))
                              for frame in frames if isinstance(frame, dict)
                          )
                          valid = (
                              isinstance(frames, list) and len(frames) > 0
                              and poses > 0 and float(document.get("Time", 0)) > 0
                          )
                          validation_error = "" if valid else "JSON has no usable keyframes/poses/duration"
                      except Exception as exc:
                          validation_error = f"invalid JSON: {exc}"
                  state = "OK" if result.returncode == 0 and valid else "FAILED"
                  report.extend([
                      f"## {source} → {output}",
                      f"- Result: **{state}**",
                      f"- Converter exit code: {result.returncode}",
                      f"- Validation: {validation_error or 'valid JSON track'}",
                      "",
                      "Output:",
                      "~~~text",
                      log[-6000:] if log else "(no converter output)",
                      "~~~",
                      "",
                  ])
                  print(f"[{state}] {source} -> {output}; exit={result.returncode}; {validation_error or 'valid'}")
              except Exception as exc:
                  report.extend([f"## {source} → {output}", "- Result: **FAILED**", f"- Error: {exc}", ""])
                  print(f"[FAILED] {source}: {exc}")

          Path("tools/animation-conversion-report.md").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          PY

      - name: Stage only valid tracks and diagnostic report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          outputs = [
              "content/GojoAwakeningTrack.anim",
              "content/MaximumHollowPurpleTrack.anim",
              "content/CidOverdriveTrack.anim",
              "content/SukunaAwakeningTrack.anim",
              "content/SokamonaTrack.anim",
          ]
          for name in outputs:
              path = Path(name)
              valid = False
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  frames = data.get("Keyframes", [])
                  pose_count = sum(
                      len(frame.get("Poses", []))
                      for frame in frames if isinstance(frame, dict)
                  )
                  valid = (
                      isinstance(frames, list) and len(frames) > 0
                      and pose_count > 0 and float(data.get("Time", 0)) > 0
                  )
              except Exception:
                  valid = False
              if valid:
                  subprocess.run(["git", "add", name], check=True)
                  print(f"Staging valid track: {name}")
              else:
                  subprocess.run(["git", "rm", "--ignore-unmatch", name], check=True)
                  print(f"Removing invalid/empty track: {name}")
          subprocess.run(["git", "add", "tools/animation-conversion-report.md"], check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No track/report changes to commit."
            exit 0
          fi
          git commit -m "Regenerate and validate NAM animation tracks"
          git pull --rebase origin main
          git push origin HEAD:main
