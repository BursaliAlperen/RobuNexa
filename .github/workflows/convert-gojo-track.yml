name: Convert Gojo animation for NAM

on:
  push:
    branches: [main]
    paths:
      - "content/GojoAwaken.anim"
      - "tools/convert_gojo_animation.py"
      - ".github/workflows/convert-gojo-track.yml"

permissions:
  contents: write

jobs:
  convert-gojo-track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RBXM parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install zstandard
          python -m pip install git+https://github.com/Ghosteined/rbxm_parser.git
      - name: Convert uploaded KeyframeSequence
        run: python tools/convert_gojo_animation.py content/GojoAwaken.anim content/GojoAwakeTrack.anim
      - name: Commit converted AnimLib track
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/GojoAwakeTrack.anim
          if git diff --cached --quiet; then
            echo "Track is already converted; no commit needed."
            exit 0
          fi
          git commit -m "Convert Gojo Awake to AnimLib track format"
          git push origin HEAD:main
