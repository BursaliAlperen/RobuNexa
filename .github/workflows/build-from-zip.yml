name: Build Roblox Forge AI EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "roblox-forge-ai/**"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roblox-forge-ai/package.json
      - name: Install dependencies
        working-directory: roblox-forge-ai
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax checks
        working-directory: roblox-forge-ai
        shell: pwsh
        run: |
          node --check desktop-main.cjs
          node --check desktop-preload.cjs
          node --check account-store.cjs
          node --check roblox-forge-bridge.js
          node --check build-exe.mjs
      - name: Build Windows x64 portable EXE
        working-directory: roblox-forge-ai
        run: npm run build:exe
      - name: Verify EXE
        working-directory: roblox-forge-ai
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist" -Filter "RobloxForgeAI-Windows-x64.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "EXE was not created" }
          if ($exe.Length -lt 50000000) { throw "EXE is suspiciously small: $($exe.Length) bytes" }
          Write-Host "EXE OK: $($exe.FullName) - $($exe.Length) bytes"
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxForgeAI-Windows-x64
          path: roblox-forge-ai/dist/RobloxForgeAI-Windows-x64.exe
          retention-days: 30
