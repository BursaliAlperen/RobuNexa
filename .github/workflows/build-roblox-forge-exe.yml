name: Build Roblox Forge AI EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "roblox-forge-ai/**"
      - ".github/workflows/build-roblox-forge-exe.yml"
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: roblox-forge-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build EXE
        run: npm run build:exe
      - name: Verify
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/RobloxForgeAI.exe")) { throw "EXE olusturulamadi." }
          $size=(Get-Item "dist/RobloxForgeAI.exe").Length
          if ($size -lt 10000000) { throw "EXE boyutu gecersiz: $size bytes" }
          Write-Host "RobloxForgeAI.exe OK - $size bytes"
      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/RobloxForgeAI.exe release/RobloxForgeAI.exe
          Set-Content release/README.txt "Roblox Forge AI Bridge - EXE icinde Node.js runtime var."
          Compress-Archive -Path release/* -DestinationPath RobloxForgeAI-Windows-x64.zip -Force
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RobloxForgeAI-Windows-x64
          path: roblox-forge-ai/dist/RobloxForgeAI.exe
          retention-days: 30
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RobloxForgeAI-Windows-x64-ZIP
          path: roblox-forge-ai/RobloxForgeAI-Windows-x64.zip
          retention-days: 30
