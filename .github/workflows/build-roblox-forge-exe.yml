name: Build Roblox Forge AI Desktop EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "roblox-forge-ai/**"
      - ".github/workflows/build-roblox-forge-exe.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: roblox-forge-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.5.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Stamp version
        shell: pwsh
        run: npm version 3.0.$env:GITHUB_RUN_NUMBER --no-git-tag-version --allow-same-version
      - name: Static checks
        run: npm run check
      - name: Bridge contract test
        run: node tests/bridge-contract.test.cjs
      - name: Build desktop EXE
        run: npm run build:exe
      - name: Verify bundled bridge
        run: node --check dist/bridge.cjs
      - name: Verify EXE
        shell: pwsh
        run: |
          $exe="dist/RobloxForgeAI-Windows-x64.exe"
          if (-not (Test-Path $exe)) { throw "EXE oluşturulamadı." }
          $size=(Get-Item $exe).Length
          if ($size -lt 50000000) { throw "EXE boyutu geçersiz: $size bytes" }
          Write-Host "RobloxForgeAI EXE OK - $size bytes"
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RobloxForgeAI-Windows-x64
          path: roblox-forge-ai/dist/RobloxForgeAI-Windows-x64.exe
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rfa-v3.0.${{ github.run_number }}
          name: Roblox Forge AI v3.0.${{ github.run_number }}
          body: |
            Roblox Forge AI Windows desktop app.
            Includes the Forge UI, local Roblox Studio MCP bridge, bridge status/health reporting, and direct Astra command console.
          files: roblox-forge-ai/dist/RobloxForgeAI-Windows-x64.exe
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
